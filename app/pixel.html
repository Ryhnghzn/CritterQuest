<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Uji Gaya Pixel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07080c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#gl,#ui{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
#ui{touch-action:none}
#bar{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw;z-index:5}
#bar button{font:600 12px system-ui,sans-serif;color:#cfc6b4;background:rgba(10,9,12,.82);border:1px solid #3a3239;border-radius:0;padding:6px 9px;cursor:pointer}
#bar button.on{border-color:#b8913f;color:#e0c27a}
#fps{position:fixed;left:8px;bottom:max(6px,env(safe-area-inset-bottom));font:11px system-ui,sans-serif;color:#6a6258;pointer-events:none;z-index:5}
#help{position:fixed;right:8px;bottom:max(6px,env(safe-area-inset-bottom));font:11px system-ui,sans-serif;color:#6a6258;pointer-events:none;z-index:5;text-align:right}
@media (pointer:coarse){#help{display:none}}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:600 14px system-ui,sans-serif;color:#b8913f;background:#07080c;z-index:9}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<div id="bar"></div>
<div id="fps"></div>
<div id="help">WASD / panah: jalan · Klik kiri / J: tembak ke arah mouse · 1 2 3: bidik skill lalu klik kiri (klik kanan / Esc: batal) · C: ganti kelas · E: bicara · Q / R atau klik-kanan geser: putar kamera · M: gaya A / B · N: malam/senja · P: kunci palet · + / −: zoom</div>
<pre id="err" style="display:none;position:fixed;left:8px;top:8px;max-width:80vw;white-space:pre-wrap;font:12px monospace;color:#ff9a80;background:rgba(0,0,0,.8);padding:8px;z-index:20"></pre>
<div id="loading">Menyiapkan dunia…</div>
<script type="module" src="/pixel/main.js"></script>
</body>
</html>
