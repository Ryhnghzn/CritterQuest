<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eclipse Warden</title>
<style>
  body { margin: 0; background: #15131a; color: #e8e1d4; font: 15px/1.4 Georgia, serif; padding: 16px; }
  h1 { margin: 0 0 12px; font-size: 22px; font-weight: normal; color: #c9a45c; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  figure { margin: 0; }
  figcaption { color: #9d93a4; font-size: 13px; margin-top: 6px; }
  .doll { position: relative; aspect-ratio: 512 / 768; background: #2a2531; border: 1px solid #3a3442; border-radius: 10px; overflow: hidden; }
  .big { width: min(92vw, 460px); }
  .old { width: min(92vw, 300px); }
  .small { width: 54px; }
  .doll img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .doll img[hidden] { display: none; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  button { font: inherit; font-size: 13px; color: #e8e1d4; background: #29252f; border: 1px solid #3a3442; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: #c9a45c; color: #c9a45c; }
</style>
</head>
<body>
<h1>Eclipse Warden</h1>
<div class="tools" id="tools"></div>
<div class="row">
  <figure><div class="doll big" id="big"></div><figcaption>New: ¾ view</figcaption></figure>
  <figure><div class="doll old" id="old"></div><figcaption>Old: front view</figcaption></figure>
  <figure><div class="doll small" id="small"></div><figcaption>Game size</figcaption></figure>
</div>
<script>
  const LAYERS = [['back', 'Wings'], ['base', null], ['boots', 'Boots'], ['weapon', 'Weapon'], ['armor', 'Armor'], ['helm', 'Helm']];
  const OLD = ['back-dragon-wings', 'weapon-dragon-greatsword', 'base-body', 'boots-dragon', 'chest-dragon', 'helmet-dragon'];
  const stack = (el) => LAYERS.map(([id]) => { const i = new Image(); i.src = id + '.svg'; i.alt = ''; i.dataset.id = id; el.append(i); return i; });
  const imgs = [...stack(document.getElementById('big')), ...stack(document.getElementById('small'))];
  for (const f of OLD) { const i = new Image(); i.src = '../assets/' + f + '.svg'; i.alt = ''; document.getElementById('old').append(i); }
  for (const [id, label] of LAYERS) {
    if (!label) continue;
    const b = document.createElement('button');
    b.textContent = label;
    b.setAttribute('aria-pressed', 'true');
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      for (const i of imgs) if (i.dataset.id === id) i.hidden = !on;
    });
    document.getElementById('tools').append(b);
  }
</script>
</body>
</html>
