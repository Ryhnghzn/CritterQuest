<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut-out Rig Test</title>
<style>
  body { margin: 0; background: #15131a; color: #e8e1d4; font: 15px/1.4 Georgia, serif; padding: 16px; }
  h1 { margin: 0 0 10px; font-size: 22px; font-weight: normal; color: #c9a45c; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  canvas { background: #262130; border: 1px solid #3a3442; border-radius: 10px; display: block; max-width: 100%; }
  figure { margin: 0; } figcaption { color: #9d93a4; font-size: 13px; margin-top: 6px; }
  .tools { display: flex; gap: 8px; margin-bottom: 12px; }
  button { font: inherit; font-size: 14px; color: #e8e1d4; background: #29252f; border: 1px solid #3a3442; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: #c9a45c; color: #c9a45c; }
</style>
</head>
<body>
<h1>Cut-out Rig Test</h1>
<div class="tools">
  <button type="button" data-mode="idle">Idle</button>
  <button type="button" data-mode="walk" aria-pressed="true">Walk</button>
  <button type="button" data-mode="attack">Attack</button>
  <button type="button" data-mode="sit">Sit</button>
  <button type="button" data-mode="kneel">Kneel</button>
</div>
<div class="row">
  <figure><canvas id="big" width="760" height="860"></canvas><figcaption>Large</figcaption></figure>
  <figure><canvas id="small" width="110" height="170"></canvas><figcaption>Game size (estimate)</figcaption></figure>
</div>
<script>
  // All lengths are pixels of the full-figure art, so every piece shares one scale.
  // Angles: 0 = limb pointing down, positive swings it backward (character faces right).
  const NAMES = ['coat', 'head', 'pauldron', 'vambrace', 'hand', 'sword', 'thigh', 'knee', 'shin', 'foot'];
  const FAR = '#0c0d18', INK = '#0b0910';
  const parts = {}, dark = {};
  const load = (n) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(parts[n] = i); i.onerror = no; i.src = `parts/${n}.webp`; });
  function tint(img) {
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-in'; g.fillStyle = FAR; g.fillRect(0, 0, c.width, c.height);
    return c;
  }

  const THIGH = 168, SHIN = 202, ANKLE = 42, UPPER = 128, FORE = 158, WAIST = 40;
  const FAR_K = .8, FAR_LEG = .88, FAR_UP = 34, FAR_SH = [86, -226];   // depth of the far limbs
  const COAT = { scale: 1.72, cut: 205, x: 142 };   // waist point inside the coat image
  // piece: [anchor x, anchor y, scale]
  const P = { thigh: [49, 8, 1.18], shin: [44, 34, 1.3], foot: [40, 12, 1.12], knee: [43, 62, 1.02], kneeArm: [43, 62, .56], vambrace: [46, 8, 1.15], hand: [46, 104, 1], sword: [54, 100, 1], pauldron: [84, 92, 1.12], head: [100, 190, 1] };
  function put(g, img, key, x, y, ang) {
    const [ax, ay, k] = P[key];
    g.save(); g.translate(x, y); g.rotate(ang); g.scale(k, k); g.drawImage(img, -ax, -ay); g.restore();
  }
  const ease = (u) => u * u * (3 - 2 * u);
  function K(keys, a) {
    let i = 0; while (i < keys.length - 2 && a > keys[i + 1][0]) i++;
    const [p0, v0] = keys[i], [p1, v1] = keys[i + 1];
    return v0 + (v1 - v0) * ease(Math.min(1, Math.max(0, (a - p0) / (p1 - p0))));
  }
  const dirOf = (dx, dy) => Math.atan2(-dx, dy);

  // two-bone leg from the hip to an ankle target; the knee always bends forward
  function solve(hx, hy, ax, ay) {
    const dx = ax - hx, dy = ay - hy, d = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 1);
    const u = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d), v = Math.sqrt(Math.max(0, THIGH * THIGH - u * u));
    const n = Math.hypot(dx, dy) || 1, ex = dx / n, ey = dy / n;
    let kx = hx + ex * u + ey * v, ky = hy + ey * u - ex * v;
    const ox = hx + ex * u - ey * v, oy = hy + ey * u + ex * v;
    if (ox > kx) { kx = ox; ky = oy; }
    return { kx, ky };
  }

  function leg(g, set, hx, hy, ax, ay, toe) {
    const { kx, ky } = solve(hx, hy, ax, ay), th = dirOf(kx - hx, ky - hy), sh = dirOf(ax - kx, ay - ky);
    put(g, set.foot, 'foot', ax, ay, toe);
    put(g, set.shin, 'shin', kx, ky, sh);
    put(g, set.thigh, 'thigh', hx, hy, th);
    put(g, set.knee, 'knee', kx, ky, (th + sh) / 2);
  }

  function arm(g, set, x, y, sh, el, wr, sword) {
    const ex = x - Math.sin(sh) * UPPER, ey = y + Math.cos(sh) * UPPER, f = sh + el;
    const hx = ex - Math.sin(f) * FORE, hy = ey + Math.cos(f) * FORE, h = f + wr;
    // the upper arm is plain black cloth in the art, so it is drawn here
    g.lineCap = 'round';
    const far = set === dark;
    g.strokeStyle = far ? FAR : INK; g.lineWidth = 58; g.beginPath(); g.moveTo(x, y); g.lineTo(ex, ey); g.stroke();
    if (!far) { g.strokeStyle = '#1b1a22'; g.lineWidth = 51; g.beginPath(); g.moveTo(x, y); g.lineTo(ex, ey); g.stroke(); }
    put(g, set.vambrace, 'vambrace', ex, ey, f);
    if (sword != null) { g.save(); g.translate(hx, hy); g.rotate(h + sword); g.scale(P.sword[2], P.sword[2]); g.drawImage(parts.sword, -P.sword[0], -P.sword[1]); g.restore(); }
    put(g, set.hand, 'hand', hx, hy, h + Math.PI);
    put(g, set.knee, 'kneeArm', ex, ey, sh + el / 2);
  }

  // skirt strips below the waist: swing lags toward the hem, fold pushes the cloth back when seated
  function skirt(g, sway, fold, w) {
    const c = parts.coat, W = c.width, H = c.height, S = COAT.scale, step = 3;
    for (let y = COAT.cut - 16; y < H; y += step) {
      const k = Math.max(0, y - COAT.cut) / (H - COAT.cut);
      const dx = sway * k * k * 40 * Math.sin(w - k * 1.6) - fold * k * 150;
      g.drawImage(c, 0, y, W, step + 1, -COAT.x * S + dx, (y - COAT.cut) * S * (y > COAT.cut ? 1 - fold * .45 : 1), W * S, (step + 1) * S);
    }
  }

  function target(mode, t) {
    const w = t * 6.2, atk = mode === 'attack' ? (t % 1.15) / 1.15 : 0;
    const p = { x: 0, hip: 392 + Math.sin(t * 2) * 3, lean: .02, nx: -118, ny: 0, fx: 104, fy: 0, ntoe: 0, ftoe: 0, sh: .42, el: -.38, wr: 0, sword: -.7, fsh: .52, fel: -.34, sway: .18, fold: 0, front: 0, seat: 0, w };
    if (mode === 'walk') {
      const near = w, far = w + Math.PI;
      Object.assign(p, { hip: 386 + Math.cos(2 * w) * 9, lean: .07, sway: 1,
        nx: 8 - Math.cos(near) * 104, ny: Math.max(0, Math.sin(near)) * 58, fx: -2 - Math.cos(far) * 104, fy: Math.max(0, Math.sin(far)) * 58,
        ntoe: -Math.max(0, Math.sin(near)) * .1 + Math.max(0, Math.cos(near)) * .28 * (Math.sin(near) > 0 ? 1 : 0),
        ftoe: 0, sh: -Math.cos(far) * .36 + .12, el: -.42, sword: -.8, fsh: .3 + Math.cos(near) * .3, fel: -.38 });
    } else if (mode === 'attack') {
      Object.assign(p, { hip: K([[0, 372], [.3, 356], [.52, 350], [1, 372]], atk), x: K([[0, 0], [.3, -26], [.52, 54], [1, 0]], atk),
        lean: K([[0, .06], [.3, -.16], [.52, .24], [1, .06]], atk), nx: 118, fx: -124, ntoe: 0, ftoe: 0,
        sh: K([[0, -.3], [.3, 2.2], [.52, -1.25], [.68, -1.05], [1, -.3]], atk), el: K([[0, -.5], [.3, -1.2], [.52, -.12], [1, -.5]], atk),
        wr: K([[0, 0], [.3, .55], [.52, -.25], [1, 0]], atk), sword: K([[0, -1.05], [.3, -1.5], [.52, -1.25], [1, -1.05]], atk),
        fsh: K([[0, .3], [.3, .7], [.52, -.2], [1, .3]], atk), fel: -.4, sway: K([[0, .2], [.52, 1], [1, .2]], atk) });
    } else if (mode === 'sit') {
      Object.assign(p, { hip: 218 + Math.sin(t * 1.6) * 2, x: -60, lean: -.04, nx: 196, fx: 160, sh: -.42, el: -1.15, wr: .1, sword: -.35, fsh: .2, fel: 1.1, sway: .1, fold: 1, front: 1, seat: 1 });
    } else if (mode === 'kneel') {
      Object.assign(p, { hip: 232, x: -20, lean: .1, nx: 160, fx: -196, ftoe: .9, sh: -.75, el: -.2, wr: .2, sword: -1.55, fsh: -.1, fel: .8, sway: .1, fold: .55, front: 1 });
    }
    return p;
  }

  let cur = null;
  function step(tgt, dt) {
    if (!cur || dt < 0) { cur = { ...tgt }; return; }
    const k = 1 - Math.exp(-dt * (mode === 'walk' || mode === 'attack' ? 26 : 9));
    for (const n in tgt) cur[n] = n === 'w' ? tgt[n] : cur[n] + (tgt[n] - cur[n]) * k;
  }

  function draw(g, scale) {
    const p = cur, cv = g.canvas, G = 760;
    g.clearRect(0, 0, cv.width, cv.height); g.save();
    g.translate(cv.width * .5, cv.height * .94); g.scale(scale, scale); g.translate(0, -G);
    g.fillStyle = 'rgba(0,0,0,.34)'; g.beginPath(); g.ellipse(p.x, G + 2, 190, 16, 0, 0, 7); g.fill();
    if (p.seat > .02) { // stone block for the seated pose
      g.globalAlpha = Math.min(1, p.seat); const top = G - 182;
      g.fillStyle = '#4a4556'; g.strokeStyle = INK; g.lineWidth = 4; g.beginPath(); g.rect(-190, top, 220, 182); g.fill(); g.stroke();
      g.fillStyle = '#6a6478'; g.fillRect(-188, top + 2, 216, 14); g.globalAlpha = 1;
    }
    const hy = G - p.hip, hx = p.x, wy = hy - WAIST, S = COAT.scale, c = parts.coat;
    const ank = (x, y) => [p.x + x, G - ANKLE - y];
    const shN = [-112, -240], neck = [-14, -312];
    const torso = (fn) => { g.save(); g.translate(hx, wy); g.rotate(p.lean); fn(); g.restore(); };

    // far arm: the near arm flipped across the chest, then blacked out
    torso(() => { g.translate(FAR_SH[0], FAR_SH[1]); g.scale(-FAR_K, FAR_K); arm(g, dark, 0, 0, p.fsh, p.fel, 0, null); put(g, dark.pauldron, 'pauldron', 6, -8, p.fsh * .12); });
    const [fax, fay] = ank(p.fx + 24, p.fy + FAR_UP);
    g.save(); g.translate(hx + 22, hy); g.scale(FAR_LEG, FAR_LEG); leg(g, dark, 0, 0, (fax - hx - 22) / FAR_LEG, (fay - hy) / FAR_LEG, p.ftoe); g.restore();
    if (p.front < .5) leg(g, parts, hx - 24, hy, ...ank(p.nx, p.ny), p.ntoe);
    g.save(); g.translate(hx, wy); skirt(g, p.sway, p.fold, p.w); g.restore();
    if (p.front >= .5) leg(g, parts, hx - 24, hy, ...ank(p.nx, p.ny), p.ntoe);
    torso(() => {
      g.drawImage(c, 0, 0, c.width, COAT.cut, -COAT.x * S, -COAT.cut * S, c.width * S, COAT.cut * S);
      put(g, parts.head, 'head', neck[0], neck[1], -p.lean * .6);
      arm(g, parts, shN[0], shN[1], p.sh, p.el, p.wr, p.sword);
      put(g, parts.pauldron, 'pauldron', shN[0] + 6, shN[1] - 8, p.sh * .12);
    });
    g.restore();
  }

  const q = new URLSearchParams(location.search), freeze = q.has('t') ? +q.get('t') : null;
  let mode = q.get('mode') || 'walk';
  const big = document.getElementById('big').getContext('2d'), small = document.getElementById('small').getContext('2d');
  const paint = () => { draw(big, .72); draw(small, .16); };
  document.querySelectorAll('[data-mode]').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    b.addEventListener('click', () => { mode = b.dataset.mode; document.querySelectorAll('[data-mode]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); });
  });
  Promise.all(NAMES.map(load)).then(() => {
    for (const n of NAMES) dark[n] = tint(parts[n]);
    if (freeze != null) { step(target(mode, freeze), -1); paint(); document.body.dataset.ready = '1'; return; }
    let last = 0;
    const loop = (ms) => { step(target(mode, ms / 1000), Math.min(.05, (ms - last) / 1000)); last = ms; paint(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
</script>
</body>
</html>
