<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768" width="512" height="768">
  <title>Helmet — iron nasal helm</title>
  <defs>
    <style>
      .ln{fill:none;stroke:#1e1c1d;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
      .fn{fill:none;stroke:#1e1c1d;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
      .ir{fill:#8f979e}.irS{fill:#646b72}.irD{fill:#474c52}.irH{fill:#bcc3c8}.irX{fill:#e1e6e9}
      .rv{fill:#c9cfd3;stroke:#1e1c1d;stroke-width:1.1}
    </style>
    <pattern id="mail" width="7" height="5" patternUnits="userSpaceOnUse">
      <rect width="7" height="5" fill="#5d646a"/>
      <path d="M0,3.4 A3.5,2.6 0 0 1 7,3.4" fill="none" stroke="#9aa2a8" stroke-width="1.2"/>
      <path d="M-3.5,6 A3.5,2.6 0 0 1 3.5,6 M3.5,6 A3.5,2.6 0 0 1 10.5,6 M-3.5,1 A3.5,2.6 0 0 1 3.5,1 M3.5,1 A3.5,2.6 0 0 1 10.5,1" fill="none" stroke="#3d4247" stroke-width="1"/>
    </pattern>
    <clipPath id="domeC"><path d="M206,112 C204,80 226,56 256,54 C286,56 308,80 306,112 Z"/></clipPath>
  </defs>
  <g transform="translate(256,171) scale(0.86) translate(-256,-171)">
    <!-- mail aventail around cheeks and neck -->
    <g id="aventL">
      <path fill="url(#mail)" d="M206,108 L202,162 C208,180 226,192 242,196 L244,180 C232,174 224,162 221,148 L222,112 Z"/>
      <path fill="#22262a" opacity="0.3" d="M202,150 C208,170 226,184 243,188 L242,196 C226,192 208,180 202,162 Z"/>
      <path class="ln" d="M206,108 L202,162 C208,180 226,192 242,196 L244,180 C232,174 224,162 221,148 L222,112"/>
    </g>
    <use href="#aventL" transform="matrix(-1 0 0 1 512 0)"/>
    <path fill="url(#mail)" d="M240,180 Q256,186 272,180 L270,196 Q256,200 242,196 Z"/>
    <path class="fn" d="M242,196 Q256,200 270,196"/>

    <path class="ir" d="M206,112 C204,80 226,56 256,54 C286,56 308,80 306,112 Z"/>
    <g clip-path="url(#domeC)">
      <path class="irS" d="M256,50 L320,50 L320,116 L256,116 Z"/>
      <path class="irD" d="M286,56 C300,70 306,90 306,116 L320,116 L320,50 Z"/>
      <path class="irH" d="M220,96 C220,78 230,64 246,58 C236,70 230,84 230,100 Z"/>
      <path class="irX" d="M226,88 C228,76 234,68 242,62 C236,72 232,80 231,90 Z"/>
    </g>
    <path class="ln" d="M206,112 C204,80 226,56 256,54 C286,56 308,80 306,112"/>
    <path d="M256,56 L256,104" stroke="#dfe5e8" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M258.5,58 L258.5,104" stroke="#1e1c1d" stroke-width="1" opacity="0.5"/>

    <!-- brow band -->
    <path class="ir" d="M202,114 Q256,98 310,114 L308,124 Q256,110 204,124 Z"/>
    <path class="irS" d="M256,106 Q284,106 310,114 L308,124 Q284,114 256,112 Z"/>
    <path class="ln" d="M202,114 Q256,98 310,114 L308,124 Q256,110 204,124 Z"/>
    <circle class="rv" cx="214" cy="115" r="2.2"/><circle class="rv" cx="234" cy="109.5" r="2.2"/>
    <circle class="rv" cx="278" cy="109.5" r="2.2"/><circle class="rv" cx="298" cy="115" r="2.2"/>

    <!-- nasal -->
    <path class="ir" d="M250,106 L262,106 L262.5,144 Q256,149 249.5,144 Z"/>
    <path class="irS" d="M256,106 L262,106 L262.5,144 Q259,147 256,147.5 Z"/>
    <path class="ln" d="M250,106 L262,106 L262.5,144 Q256,149 249.5,144 Z"/>
    <circle class="rv" cx="256" cy="114" r="1.8"/>
  </g>
</svg>
