<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768" width="512" height="768">
  <title>Weapon — celestial spear (behind the body)</title>
  <defs>
    <style>
      .ln{fill:none;stroke:#1f2433;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
      .fn{fill:none;stroke:#1f2433;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
      .wp{fill:#eef1f6}.wpS{fill:#bcc6d4}.wpD{fill:#8b97ab}.wpH{fill:#ffffff}
      .gd{fill:#d8b45f}.gdS{fill:#a07f38}.gdH{fill:#f6e2a2}
      .cl{fill:#26396e}.clS{fill:#18264d}.clH{fill:#3a529a}
      .az{fill:#5cc8ff}.azC{fill:#e4f8ff}
      .gt{fill:none;stroke:#c9a24c;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
      .fl{fill:none;stroke:#d8b45f;stroke-width:1.4;stroke-linecap:round}
      .fe{fill:#f3f5fa}.feS{fill:#d3dbe8}.feD{fill:#aab6ca}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}} .pulse{animation:pulse 2.6s ease-in-out infinite} @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}} .drift{animation:drift 3.2s ease-in-out infinite}
    </style>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="glowBig" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    
  </defs>
<g transform="translate(157,463) rotate(-6)">
