  <path class="gd" d="M-6,-384 C-22,-392 -34,-408 -36,-428 C-28,-414 -18,-406 -6,-402 Z M6,-384 C22,-392 34,-408 36,-428 C28,-414 18,-406 6,-402 Z"/><path class="ln" d="M-6,-384 C-22,-392 -34,-408 -36,-428 C-28,-414 -18,-406 -6,-402 Z M6,-384 C22,-392 34,-408 36,-428 C28,-414 18,-406 6,-402 Z"/>
  <path class="wp" d="M0,-470 C12,-444 14,-420 8,-392 L4,-380 L-4,-380 L-8,-392 C-14,-420 -12,-444 0,-470 Z"/><path class="wpS" d="M0,-470 C12,-444 14,-420 8,-392 L4,-380 L0,-380 Z"/><path class="ln" d="M0,-470 C12,-444 14,-420 8,-392 L4,-380 L-4,-380 L-8,-392 C-14,-420 -12,-444 0,-470 Z"/>
