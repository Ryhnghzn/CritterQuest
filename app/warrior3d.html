<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Warrior 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
:root{--ink:#f4f0ff;--dim:#a9a2c4;--acc:#ffc94d;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07050c;color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:96vw}
.bar.top{top:12px;bottom:auto}
.tb{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:rgba(15,10,22,.75);border:1.5px solid var(--line);border-radius:6px;padding:8px 13px;cursor:pointer}
.tb.on{border-color:var(--acc);color:var(--acc)}
#info{position:fixed;left:12px;top:12px;font-size:12px;color:var(--dim);pointer-events:none;line-height:1.5}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:18px;color:var(--acc);background:#07050c;z-index:9}
</style>
</head>
<body>
<div id="stage"><div id="loading">Memuat Three.js…</div></div>
<div id="info"></div>
<div class="bar top" id="gearBar"></div>
<div class="bar" id="animBar"></div>
<script type="module" src="./warrior3d/main.js"></script>
</body>
</html>
